<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard|VETSIS</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/tailwind.css">
<link rel="stylesheet" href="../css/validacoes.css">  

  </head>
  <body class="relative">
    <div class="grid gap grid-cols-[250px_1fr] grid-rows-[50px_1fr] h-dvh ">
      <aside class="row-span-full grid justify-items-center grid-rows-[auto_1fr_auto] py-4 gap-2">
        <div>
          <img src="../Assets/logo/logo-sem fundo.png" alt="Logo VETSIS" />
        </div>
        

        <ul class="grid  justify-items-center">
          <li class="p-2">
            <a href="dashboard.html" class="flex gap-2 ">
              <i class="bi bi-grid-fill"></i> DashBoard</a
            >
          </li>
          <li class="p-2  ">
            <a href="animais.html" class="flex gap-2">
              <img width="20" height="20" src="../Assets/icons/pawprint.png" alt=""></i> Animais</a
            >
          </li>
          <li class="p-2  ">
            <a href="veterinarios.html" class="flex gap-2">
            <img width="20" height="20" src="../Assets/icons/doctor.png" alt="Veterinário"></i> Veterinários</a
            >
          </li>
          <li class="p-2  ">
            <a href="consultas.html" class="flex gap-2">
              <img width="20" height="20" src="../Assets/icons/doctor-bag.png" alt="Consultas"> Consultas</a
            >
          </li>
          <li class="p-2   ">
            <a href="pagamentos.html" class="flex gap-2">
             <img width="20" height="20" src="../Assets/icons/credit-card.png" alt="Pagamentos"> Pagamentos</a
            >
          </li>
          <li class="p-2  ">
            <a href="relatorios.html" class="flex gap-2">
           <img width="20" height="20" src="../Assets/icons/report.png" alt="Relatório"> Relatórios</a
            >
          </li>
          <li class="p-2  ">
            <a href="usuarios.html" class="flex gap-2 w-full">
              <i class="bi bi-person-fill"></i> Usuários</a
            >
          </li>
        </ul>
        

        <button  data-btn="Sair" class="text-white bg-green-600 w-48 p-2 cursor-pointer"> <i class="bi bi-box-arrow-left "></i> Sair</button>
      </aside>
      <header class="bg-green-700 col-start-2 flex justify-between items-center px-4">
        <p class="text-white text-2xl font-bold">Segunda Feira, Dia: 29 de Maio de 2026</p>
        <div class="cursor-pointer">

        <img width="30px" height="30px" src="../Assets/Perfil/profile-icon.png" alt="Meu Perfil" >
        </div>

      </header>
      <main class="bg-gray-200 col-start-2 px-10 py-4">
        <section class="flex gap-12 ">
          <div class="bg-white rounded-sm w-1/2 h-32 flex justify-between flex-col p-2">
            <h1 class="text-lg font-bold">Veterinário</h1>
            <span class="self-end text-3xl text-green-700">2</span>
          </div>
          <div class="bg-white rounded-sm w-1/2 h-32 flex justify-between flex-col p-2">
            <h1 class="text-lg font-bold">Animais</h1>
            <span class="self-end text-3xl text-green-700">5</span>
          </div>
          <div class="bg-white rounded-sm w-1/2 h-32 flex justify-between flex-col p-2">
            <h1 class="text-lg font-bold">Usuários</h1>
            <span class="self-end text-3xl text-green-700">3</span>
          </div>
          <div class="bg-white rounded-sm w-1/2 h-32 flex justify-between flex-col p-2">
            <h1 class="text-lg font-bold">Consultas</h1>
            <span class="self-end text-3xl text-green-700">10/50</sp100
          </div>
        </section>
        <section class="mt-4">
          <div class="flex justify-between items-center">
            <h1 class="font-bold text-lg">Consultas Recentes</h1>
            <div class="flex gap-6 max-[14]:">
            <select name="consultaFiltro" id="consultaFiltro" class="px-2 rounded-sm bg-white border border-black">
                  <option value="preco">Preco</option>
                  <option value="tipo">Tipo</option>
                  <option value="animal">Animal</option>
                </select>
                <div>
                <input type="text" placeholder="Pesquise a consulta">
                  <i class="bi bi-search"></i>
                </div>
            </div>
          </div>
        </section>
      </main>
      
    </div>
   <section  data-modal="logout"  class="logout-alert fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm transition-all duration-300">
 
  <div class="bg-white rounded-2xl shadow-2xl w-96 max-w-[90%] p-6 transform transition-all duration-300 scale-100 animate-fadeIn">
    
    <div class="flex flex-col items-center text-center mb-6">
      <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mb-4">
        <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      </div>
      <h2 class="text-xl font-bold text-gray-800">Deseja realmente sair?</h2>
      <p class="text-sm text-gray-500 mt-1">Você será desconectado da sua conta.</p>
    </div>


    <div class="flex gap-3 justify-center">
      <button id="btnNao" class="px-6 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium rounded-lg transition-all duration-200 hover:shadow-md focus:ring-2 focus:ring-gray-400 focus:outline-none cursor-pointer">
        Não
      </button>
      <button id="btnSim" class="px-6 py-2.5 bg-red-600 hover:bg-red-700 text-white font-medium rounded-lg transition-all duration-200 hover:shadow-lg hover:shadow-red-300 focus:ring-2 focus:ring-red-500 focus:outline-none cursor-pointer">
        Sim, sair
      </button>
    </div>
  </div>
</section>
  </body>
<script type="module" src="../js/pages-js/dashboard.js"></script>

</html>
